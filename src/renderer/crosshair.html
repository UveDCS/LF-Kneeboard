<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cruz F10</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!-- Se muestra en el centro de la pantalla cuando el mapa F10 está abierto: el punto capturado es el centro. -->
  <svg viewBox="0 0 80 80">
    <g stroke="#000" stroke-width="4" stroke-linecap="round" opacity=".55">
      <line x1="40" y1="6" x2="40" y2="30"/><line x1="40" y1="50" x2="40" y2="74"/>
      <line x1="6" y1="40" x2="30" y2="40"/><line x1="50" y1="40" x2="74" y2="40"/>
    </g>
    <g stroke="#ff2d55" stroke-width="2" stroke-linecap="round">
      <line x1="40" y1="6" x2="40" y2="30"/><line x1="40" y1="50" x2="40" y2="74"/>
      <line x1="6" y1="40" x2="30" y2="40"/><line x1="50" y1="40" x2="74" y2="40"/>
    </g>
    <circle cx="40" cy="40" r="2.5" fill="#ff2d55" stroke="#000" stroke-width="1"/>
  </svg>
</body>
</html>
